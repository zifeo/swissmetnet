[project]
name = "swissmetnet"
version = "0.1.0"
description = "Transform and store weather data from MeteoSwiss"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.1.1",
    "pymongo>=4.20.0",
    "boto3>=1.44.3",
    "pyarrow>=26.0.0",
    "requests>=2.32.0",
]

[project.scripts]
swn = "swissmetnet.main:run"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "pre-commit>=4.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swissmetnet"]
